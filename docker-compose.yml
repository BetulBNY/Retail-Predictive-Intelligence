services:
  postgres:
    image: postgres:16
    container_name: retail_db
    # restart: always
    env_file:
    - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ingest:
    build: .
    container_name: data_ingest
    env_file:        
      - .env  
    environment:
    - PYTHONUNBUFFERED=1
    depends_on:
    - postgres
    volumes:
      - .:/app

volumes:
  postgres_data: